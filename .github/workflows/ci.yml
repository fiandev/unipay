name: CI

on:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [bun-latest, node-20, node-22]
        include:
          - runtime: bun-latest
            node-version: '22'
            use-bun: true
          - runtime: node-20
            node-version: '20'
            use-bun: false
          - runtime: node-22
            node-version: '22'
            use-bun: false

    name: Test (${{ matrix.runtime }})

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        if: matrix.use-bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        if: ${{ !matrix.use-bun }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          if [ "${{ matrix.use-bun }}" = "true" ]; then
            bun install
          else
            npm install
          fi

      - name: Typecheck
        run: |
          if [ "${{ matrix.use-bun }}" = "true" ]; then
            bun run typecheck
          else
            npx tsc --noEmit
          fi

      - name: Lint
        run: |
          if [ "${{ matrix.use-bun }}" = "true" ]; then
            bun run lint
          else
            npx eslint src tests
          fi

      - name: Test with coverage
        run: |
          if [ "${{ matrix.use-bun }}" = "true" ]; then
            bun run test -- --coverage
          else
            npx vitest run --coverage
          fi

      - name: Build
        run: |
          if [ "${{ matrix.use-bun }}" = "true" ]; then
            bun run build
          else
            npx tsup
          fi

      - name: Check no internal type leak
        run: |
          if [ "${{ matrix.use-bun }}" = "true" ]; then
            bun run scripts/check-no-internal-leak.ts
          else
            npx tsx scripts/check-no-internal-leak.ts
          fi

  packaging-smoke-test:
    runs-on: ubuntu-latest
    name: Packaging Smoke Test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install and build
        run: |
          bun install
          bun run build

      - name: Create tarball
        run: npm pack

      - name: Verify tarball contents (npm)
        run: |
          TARBALL=$(ls *.tgz)
          echo "Tarball: $TARBALL"
          tar tzf "$TARBALL" | grep -E "^package/(dist/|README\.md|LICENSE|package\.json)$" > /dev/null
          echo "✅ Tarball contains expected files"
          # Verify no source files leaked
          if tar tzf "$TARBALL" | grep -qE "^package/src/"; then
            echo "❌ Source files leaked into tarball"
            exit 1
          fi
          echo "✅ No source files in tarball"

      - name: npm install smoke test (ESM + CJS)
        run: |
          TARBALL=$(ls *.tgz)
          mkdir -p /tmp/smoke-npm && cd /tmp/smoke-npm
          npm init -y > /dev/null 2>&1
          npm install "$GITHUB_WORKSPACE/$TARBALL" > /dev/null 2>&1
          # ESM import
          node --input-type=module -e "import { UnipayClient } from 'unipay-sdk'; console.log('ESM import OK:', typeof UnipayClient);"
          # CJS require
          node -e "const { UnipayClient } = require('unipay-sdk'); console.log('CJS require OK:', typeof UnipayClient);"

      - name: yarn install smoke test
        run: |
          TARBALL=$(ls *.tgz)
          mkdir -p /tmp/smoke-yarn && cd /tmp/smoke-yarn
          yarn init -y > /dev/null 2>&1
          yarn add "$GITHUB_WORKSPACE/$TARBALL" > /dev/null 2>&1
          node --input-type=module -e "import { UnipayClient } from 'unipay-sdk'; console.log('Yarn ESM OK:', typeof UnipayClient);"

      - name: pnpm install smoke test
        run: |
          TARBALL=$(ls *.tgz)
          mkdir -p /tmp/smoke-pnpm && cd /tmp/smoke-pnpm
          pnpm init > /dev/null 2>&1
          pnpm add "$GITHUB_WORKSPACE/$TARBALL" > /dev/null 2>&1
          node --input-type=module -e "import { UnipayClient } from 'unipay-sdk'; console.log('pnpm ESM OK:', typeof UnipayClient);"

  publish:
    runs-on: ubuntu-latest
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, packaging-smoke-test]

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install and build
        run: |
          bun install
          bun run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
